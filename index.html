<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4-Hole Saree Pattern Visualizer</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f1ed;
            color: #222;
            padding: 30px;
        }

        h1 {
            text-align: center;
            margin-bottom: 5px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 25px;
        }

        .panel {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        textarea {
            width: 100%;
            height: 220px;
            resize: vertical;
            font-family: monospace;
            font-size: 18px;
            padding: 12px;
            border: 2px solid #ccc;
            border-radius: 10px;
        }

        button {
            width: 100%;
            margin-top: 15px;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #222;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #444;
        }

        .holes {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 20px 0;
        }

        .hole {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            background: #333;
            border: 5px solid #aaa;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            transition: 0.25s;
        }

        .hole.active {
            background: #d4a017;
            border-color: #ffe08a;
            box-shadow: 0 0 18px #d4a017;
        }

        .fabric {
            min-height: 500px;
            padding: 25px;
            border-radius: 10px;

            /* Saree-like base */
            background:
                repeating-linear-gradient(
                    90deg,
                    #8e2635 0px,
                    #8e2635 4px,
                    #a52f40 5px,
                    #7e2030 7px
                );

            overflow: auto;
        }

        .pattern {
            display: grid;
            grid-template-columns: repeat(4, 55px);
            gap: 3px;

            margin: auto;
            width: max-content;
        }

        .cell {
            width: 55px;
            height: 30px;
            border-radius: 5px;
        }

        .cell.on {
            background: linear-gradient(
                to bottom,
                #fff1a8,
                #d4a017,
                #fff0a0
            );

            box-shadow:
                0 2px 3px rgba(0,0,0,0.3),
                inset 0 1px 2px white;
        }

        .cell.off {
            background: transparent;
        }

        .row-label {
            margin-top: 20px;
            text-align: center;
            color: white;
            font-weight: bold;
        }

        .status {
            margin-top: 15px;
            padding: 10px;
            border-radius: 8px;
            background: #eee;
            font-family: monospace;
            text-align: center;
        }

        @media(max-width: 750px) {
            .container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <h1>🧵 4-Hole Saree Pattern Visualizer</h1>

    <div class="subtitle">
        Digital Pattern → 4 Hole Selection → Woven Design
    </div>

    <div class="container">

        <!-- LEFT SIDE -->
        <div class="panel">

            <h2>Pattern Code</h2>

            <p>
                Each row must contain exactly 4 digits.
            </p>

            <textarea id="code">1010
1110
0110
0110
1111
0110
0010
0110
1110
1010</textarea>

            <button id="runBtn">
                ▶ RUN PATTERN
            </button>

            <h3>4 Holes</h3>

            <div class="holes">
                <div class="hole" id="hole1">H1</div>
                <div class="hole" id="hole2">H2</div>
                <div class="hole" id="hole3">H3</div>
                <div class="hole" id="hole4">H4</div>
            </div>

            <div class="status" id="status">
                Ready
            </div>

        </div>


        <!-- RIGHT SIDE -->
        <div class="panel">

            <h2>Woven Fabric Preview</h2>

            <div class="fabric">

                <div class="pattern" id="pattern">
                    <!-- Pattern generated here -->
                </div>

                <div class="row-label">
                    GOLDEN YARN PATTERN
                </div>

            </div>

        </div>

    </div>


<script>

    const textarea = document.getElementById("code");
    const patternContainer = document.getElementById("pattern");
    const runBtn = document.getElementById("runBtn");
    const status = document.getElementById("status");

    const holes = [
        document.getElementById("hole1"),
        document.getElementById("hole2"),
        document.getElementById("hole3"),
        document.getElementById("hole4")
    ];


    function getPattern() {

        const lines = textarea.value
            .split("\n")
            .map(line => line.trim())
            .filter(line => line.length > 0);

        const validRows = [];

        for (let line of lines) {

            if (!/^[01]{4}$/.test(line)) {
                continue;
            }

            validRows.push(line);
        }

        return validRows;
    }


    function drawPattern(rows) {

        patternContainer.innerHTML = "";

        rows.forEach(row => {

            for (let bit of row) {

                const cell = document.createElement("div");

                cell.classList.add("cell");

                if (bit === "1") {
                    cell.classList.add("on");
                } else {
                    cell.classList.add("off");
                }

                patternContainer.appendChild(cell);
            }

        });
    }


    function clearHoles() {

        holes.forEach(hole => {
            hole.classList.remove("active");
        });

    }


    function animatePattern(rows) {

        clearHoles();

        let currentRow = 0;

        const interval = setInterval(() => {

            if (currentRow >= rows.length) {

                clearInterval(interval);

                clearHoles();

                status.textContent =
                    "Pattern completed ✓";

                return;
            }

            const row = rows[currentRow];

            for (let i = 0; i < 4; i++) {

                if (row[i] === "1") {
                    holes[i].classList.add("active");
                } else {
                    holes[i].classList.remove("active");
                }

            }

            status.textContent =
                "Row " + (currentRow + 1) +
                " → " + row;

            currentRow++;

        }, 500);

    }


    runBtn.addEventListener("click", () => {

        const rows = getPattern();

        if (rows.length === 0) {

            status.textContent =
                "Invalid pattern! Use 4 binary digits per row.";

            return;
        }

        drawPattern(rows);

        animatePattern(rows);

    });


    // Show initial pattern
    const initialRows = getPattern();

    drawPattern(initialRows);

</script>

</body>
</html>
